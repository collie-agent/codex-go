name: react
# 可选的宿主运行时授权（顶层全局配置）；命令行显式参数优先。
# discover_host_commands: true
# exec_commands: [poetry, python3]
# runtime_dirs: [/home/user/go]
# 列表参数整项替换 YAML；--discover-host-commands=false 可关闭发现。
# 调用命令还需在执行代理的 allow_tools 中启用 exec；详见 README 的运行时配置。
# exec_network: none  # host 可访问宿主发布的 MySQL TCP 端口
# exec_env: [CODEX_TEST_MYSQL_URL]  # 只填变量名，值由宿主环境提供
# Provider 日志目录，默认 ./logs；命令行 --log-dir 可覆盖。
# log_dir: ./logs
# debug 额外显示流式文本片段；info 显示上下文和工具结果；error 仍显示工具调用和完整响应文本。
log_level: info
# 可选 Redis Stream 输出，格式说明见 docs/redis-output.md。
redis:
  addr: 127.0.0.1:6379
#   password_env: CODEX_REDIS_PASSWORD
#   db: 0
base:
  llm:
    # 留空 base_url 时默认使用 https://api.openai.com/v1。
    api_key_env: OPENAI_API_KEY
    model: your-model
    output_schema: json_llm_output
    # true 使用流式返回；debug 打印片段，所有级别均在完成后打印完整响应文本。
    stream: false
  allow_tools:
    - read_file
    - list_dir
    - glob
    - grep
    - apply_patch
  sys_prompt: |
    保持任务范围清晰：只修改工作目录中的目标文件，并在完成时简要说明验证结果。
agents:
  # 可选：省略 compact 时继承 base；llm 为整块替换。
  # compact:
  #   llm:
  #     api_key_env: OPENAI_API_KEY
  #     model: your-compact-model
  #     output_schema: line_protocol_llm_output
  observe:
    # 空提示词覆盖 base 的提示词，只保留观察器内置提示词。
    sys_prompt: ""
