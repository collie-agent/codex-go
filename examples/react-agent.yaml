name: react
# debug 额外显示流式文本片段；info 显示上下文和工具结果；error 仍显示工具调用和完整响应文本。
log_level: info
# 可选 Redis Stream 输出，格式说明见 docs/redis-output.md。
redis:
  addr: 127.0.0.1:6379
#   password_env: CODEX_REDIS_PASSWORD
#   db: 0
base:
  llm:
    # 留空 base_url 时默认使用 https://api.openai.com/v1。
    api_key_env: OPENAI_API_KEY
    model: your-model
    output_schema: json_llm_output
    # true 使用流式返回；debug 打印片段，所有级别均在完成后打印完整响应文本。
    stream: false
  allow_tools:
    - read_file
    - list_dir
    - glob
    - grep
    - apply_patch
  sys_prompt: |
    保持任务范围清晰：只修改工作目录中的目标文件，并在完成时简要说明验证结果。
agents:
  observe:
    # 空提示词覆盖 base 的提示词，只保留观察器内置提示词。
    sys_prompt: ""
