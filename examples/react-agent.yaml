name: react
# info 显示上下文和工具结果；error 仍显示工具调用名称、ID、参数和 LLM response text。
log_level: info
base:
  llm:
    # 留空 base_url 时默认使用 https://api.openai.com/v1。
    api_key_env: OPENAI_API_KEY
    model: your-model
    output_schema: json_llm_output
  allow_tools:
    - read_file
    - list_dir
    - glob
    - grep
    - apply_patch
  sys_prompt: |
    保持任务范围清晰：只修改工作目录中的目标文件，并在完成时简要说明验证结果。
agents:
  task_analyzer:
    # 独立 llm 整块替换 base.llm；未提供 api_key 时仍需提供密钥字段或 OPENAI_API_KEY。
    llm:
      api_key_env: ANALYZER_API_KEY
      model: analyzer-model
    sys_prompt: "分析器专用约束"
    # 内部代理始终无工具能力；显式空列表是有效配置。
    allow_tools: []
  observe:
    # 空提示词覆盖 base 的提示词，只保留观察器内置提示词。
    sys_prompt: ""
