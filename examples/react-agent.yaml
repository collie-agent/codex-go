name: react
observe: false # 设为 true 后异步观察 exec 结果
# 可选的宿主运行时授权（顶层全局配置）；命令行显式参数优先。
discover_host_commands: true
exec_commands: [poetry, python3, make, go]
runtime_dirs: [/home/xzp/.cache/pypoetry/virtualenvs/atom-mcp-1GWcgsa5-py3.12,/home/xzp/workspace/atom-mcp]
exec_network: host  # host 可访问宿主发布的 MySQL TCP 端口
exec_env: [CODEX_MYSQL_URL,CODEX_TEST_MYSQL_URL]  # 只填变量名，值由宿主环境提供
# Provider 日志目录，默认 ./logs；命令行 --log-dir 可覆盖。
# log_dir: ./logs
# debug 额外显示流式文本片段；info 显示上下文和工具结果；error 仍显示工具调用和完整响应文本。
log_level: info
# 可选 Redis Stream 输出，格式说明见 docs/redis-output.md。
redis:
  addr: 127.0.0.1:6379
#   password_env: CODEX_REDIS_PASSWORD
#   db: 0
base:
  llm:
    # 留空 base_url 时默认使用 https://api.openai.com/v1。
    api_key_env: OPENAI_API_KEY
    model: your-model
    output_schema: json_llm_output
    # true 使用流式返回；debug 打印片段，所有级别均在完成后打印完整响应文本。
    stream: false
  allow_tools:
    - read_file
    - list_dir
    - glob
    - grep
    - apply_patch
    - exec
    - exec_start
    - exec_poll
    - exec_stop
  sys_prompt: |
    保持任务范围清晰：只修改工作目录中的目标文件，并在完成时简要说明验证结果。
agents:
  # 可选：省略 compact 时继承 base；llm 为整块替换。
  # compact:
  #   llm:
  #     api_key_env: OPENAI_API_KEY
  #     model: your-compact-model
  #     output_schema: line_protocol_llm_output
  observe:
    # 空提示词覆盖 base 的提示词，只保留观察器内置提示词。
    sys_prompt: ""

# 可选：允许 exec 下载依赖并跨调用复用缓存。目录须为工作目录外的专用绝对路径。
# exec_network: host
# exec_go_proxy: https://proxy.golang.org,direct
# exec_caches:
